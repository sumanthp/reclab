[project]
name = "reclab"
version = "0.1.0"
description = "An open-source platform for reasoning about, configuring, and evaluating recommendation system architectures on your own data."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Sumanth Polisetty" },
]
# Deliberately no deep-learning framework dependency. Every architecture in
# src/reclab/architectures/ is implemented in NumPy — including SASRec's
# causal self-attention, with hand-derived backprop checked against
# numerical gradients (see tests/architectures/test_sasrec_gradients.py).
# This was a constraint, not a preference: the current PyTorch wheel on PyPI
# requires CUDA runtime libraries even for CPU-only use, which isn't
# installable in every environment (including the one this repo was
# originally built in). See CONTRIBUTING.md if you want to add a real
# PyTorch/HF-backed architecture as an alternative implementation — the
# Architecture interface (architectures/base.py) doesn't care what's
# underneath it.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]
# For AnthropicReranker (src/reclab/architectures/rerankers.py) — a real LLM
# re-ranker for hybrid_llm. Not a dependency of the default install: the
# default reranker (LexicalReranker) needs no API key and no network access.
llm = [
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reclab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
